[project]
name = "kali-mcp"
dynamic = ["version"]
description = "Kali Linux MCP server for offensive security - 30 structured tools over stdio JSON-RPC"
requires-python = ">=3.11"
dependencies = [
    # Pin to the 1.x line: the code targets the v1 FastMCP API
    # (mcp.server.fastmcp), which was renamed/removed in mcp 2.x.
    "mcp[cli]>=1.0.0,<2",
]

[project.scripts]
kali-mcp = "kali_mcp.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "kali_mcp/_version.py"

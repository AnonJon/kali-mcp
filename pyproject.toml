[project]
name = "kali-mcp"
dynamic = ["version"]
description = "Kali Linux MCP server for offensive security - 30 structured tools over stdio JSON-RPC"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
kali-mcp = "kali_mcp.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "kali_mcp/_version.py"
